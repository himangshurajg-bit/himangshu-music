name: Build and publish Himangshu APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for this APK
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check for the existing release signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEY_ALIAS" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Decode existing release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
      - name: Build signed universal GMS release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
          :app:assembleUniversalGmsRelease
      - name: Build debug preview only when no release key is configured
        if: steps.signing.outputs.configured != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000
          ./gradlew --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            :app:assembleUniversalGmsDebug
      - name: Verify and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' -print)
          if [[ "${{ steps.signing.outputs.configured }}" == "true" ]]; then
            name='Himangshu-Music-universal-gms-release.apk'
            expected_build_type='release'
          else
            name='Himangshu-Music-universal-gms-debug.apk'
            expected_build_type='debug'
          fi
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK from the $expected_build_type variant; found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          mkdir -p dist
          cp "$apk" "dist/$name"
          test -s "dist/$name"
          unzip -tqq "dist/$name"
          if [[ "${{ steps.signing.outputs.configured }}" == "true" ]]; then
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose --print-certs "dist/$name"
          fi
          sha256sum "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Keep APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Himangshu-Music-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Publish signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --title "Himangshu Music $RELEASE_TAG" \
            --notes 'Signed universal GMS release APK. This fork retains GPL-3.0 notices and upstream attribution; source is available on main.'
      - name: Explain why no release was published
        if: steps.signing.outputs.configured != 'true'
        run: echo 'No existing release signing keystore and complete signing secrets are configured; only a debug preview artifact was built, and no GitHub Release was created.'
