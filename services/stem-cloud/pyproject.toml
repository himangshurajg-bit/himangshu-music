[project]
name = "rajtune-stem-cloud"
version = "1.0.0"
description = "RajTune stem cloud API: authenticated upload -> KUIELab ONNX worker -> 4 WAV stems. Fail-closed when unconfigured."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
